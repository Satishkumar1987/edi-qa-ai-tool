<!-- index.html -->

<!DOCTYPE html>
<html>

<head>

<title>EDI QA AI Assistant</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

textarea{
width:100%;
height:120px;
font-size:18px;
padding:10px;
}

button{
background:#1976d2;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#125aa0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#1976d2;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.dashboard{
display:flex;
gap:20px;
margin-bottom:20px;
}

.box{
flex:1;
padding:20px;
color:white;
border-radius:10px;
font-size:24px;
font-weight:bold;
}

.blue{background:#1976d2;}
.green{background:green;}
.red{background:red;}
.orange{background:orange;}

pre{
background:#eee;
padding:15px;
border-radius:5px;
white-space:pre-wrap;
}

select{
padding:5px;
font-size:16px;
}

</style>

</head>

<body>

<h1>🏥 EDI QA AI Assistant</h1>

<div class="card">

<h2>📊 QA Dashboard</h2>

<div class="dashboard">

<div class="box blue">
Total Tests<br>
<span id="totalTests">0</span>
</div>

<div class="box green">
Passed<br>
<span id="passedTests">0</span>
</div>

<div class="box red">
Failed<br>
<span id="failedTests">0</span>
</div>

<div class="box orange">
EDI Validations<br>
<span id="ediCount">0</span>
</div>

</div>

</div>

<div class="card">

<h2>📋 Requirement Input</h2>

<textarea id="requirement"></textarea>

<br>

<button onclick="generateTestCases()">
Generate Test Cases
</button>

</div>

<div class="card">

<h2>🧪 Test Cases</h2>

<button onclick="downloadExcel()">
Download Excel Report
</button>

<table>

<thead>

<tr>
<th>Scenario</th>
<th>Steps</th>
<th>Expected Result</th>
<th>Status</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<div class="card">

<h2>🐞 Defect Report</h2>

<div id="defectReport"></div>

</div>

<div class="card">

<h2>📂 Upload EDI File</h2>

<input type="file" id="ediFile">

<br>

<button onclick="validateEDI()">
Validate EDI
</button>

<h3>Validation Result</h3>

<pre id="ediResult"></pre>

</div>

<script>

function generateTestCases(){

let requirement =
document.getElementById("requirement").value;

fetch("http://127.0.0.1:5000/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
requirement:requirement
})

})

.then(response=>response.json())

.then(data=>{

let tableBody =
document.getElementById("tableBody");

tableBody.innerHTML="";

data.forEach(tc=>{

let row = `

<tr>

<td>${tc.scenario}</td>

<td>${tc.steps}</td>

<td>${tc.expected}</td>

<td>

<select onchange="updateDashboard()">

<option value="">Select</option>
<option value="PASS">PASS</option>
<option value="FAIL">FAIL</option>

</select>

</td>

</tr>

`;

tableBody.innerHTML += row;

});

document.getElementById("totalTests").innerText =
data.length;

updateDashboard();

});

}

function updateDashboard(){

let selects =
document.querySelectorAll("select");

let pass = 0;
let fail = 0;

let defectHTML = "";

selects.forEach((select,index)=>{

if(select.value==="PASS"){
pass++;
}

if(select.value==="FAIL"){

fail++;

let row =
document.querySelectorAll("#tableBody tr")[index];

let cols = row.querySelectorAll("td");

defectHTML += `

<pre>

Bug Title: ${cols[0].innerText} failed

Steps:
${cols[1].innerText}

Expected:
${cols[2].innerText}

Actual:
Test Failed

Severity: High

Status: Open

</pre>

`;

}

});

document.getElementById("passedTests").innerText =
pass;

document.getElementById("failedTests").innerText =
fail;

document.getElementById("defectReport").innerHTML =
defectHTML;

}

function downloadExcel(){

let rows =
document.querySelectorAll("#tableBody tr");

let data = [];

rows.forEach(row=>{

let cols = row.querySelectorAll("td");

let status =
row.querySelector("select").value;

data.push({

scenario: cols[0].innerText,
steps: cols[1].innerText,
expected: cols[2].innerText,
status: status

});

});

fetch("http://127.0.0.1:5000/export_excel", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})

.then(response => {

if(!response.ok){
throw new Error("Download Failed");
}

return response.blob();

})

.then(blob => {

const url =
window.URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download = "QA_Test_Report.xlsx";

document.body.appendChild(a);

a.click();

a.remove();

window.URL.revokeObjectURL(url);

alert("Excel Downloaded Successfully");

})

.catch(error => {

console.log(error);

alert("Excel Export Failed");

});

}

function validateEDI(){

let file =
document.getElementById("ediFile").files[0];

if(!file){

alert("Please select EDI file");

return;

}

let formData = new FormData();

formData.append("file",file);

fetch("http://127.0.0.1:5000/validate_edi",{

method:"POST",

body:formData

})

.then(response=>response.json())

.then(data=>{

document.getElementById("ediResult").innerText =
data.result.join("\n");

let count =
document.getElementById("ediCount");

count.innerText =
parseInt(count.innerText)+1;

});

}

</script>

</body>

</html>
